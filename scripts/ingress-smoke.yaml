# Smoke test for the ingress layer, from the team's haproxy-ingress-setup.md.
#
# Two backends behind two hostnames proves HOST-BASED ROUTING rather than a
# single default backend. Four things pass or fail together here: hosts-file
# DNS, the k3d port mapping, TLS termination from the datum-platform-tls
# Secret, and host routing.
#
#   kubectl apply -f scripts/ingress-smoke.yaml
#   curl https://iam.datum.local      # BACKEND A, no -k needed
#   curl https://apps.datum.local     # BACKEND B
#   curl -sI http://iam.datum.local   # 301 -> https
#   kubectl delete -f scripts/ingress-smoke.yaml
#
# If curl needs -k, the certificate is NOT coming from datum-platform-tls -
# HAProxy is serving its self-signed fallback.
apiVersion: apps/v1
kind: Deployment
metadata: { name: backend-a, namespace: datum-platform }
spec:
  replicas: 1
  selector: { matchLabels: { app: backend-a } }
  template:
    metadata: { labels: { app: backend-a } }
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          command: ["/bin/sh","-c","echo 'BACKEND A' > /usr/share/nginx/html/index.html && exec nginx -g 'daemon off;'"]
          ports: [{ containerPort: 80 }]
---
apiVersion: v1
kind: Service
metadata: { name: backend-a, namespace: datum-platform }
spec:
  selector: { app: backend-a }
  ports: [{ port: 80, targetPort: 80 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: backend-b, namespace: datum-platform }
spec:
  replicas: 1
  selector: { matchLabels: { app: backend-b } }
  template:
    metadata: { labels: { app: backend-b } }
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          command: ["/bin/sh","-c","echo 'BACKEND B' > /usr/share/nginx/html/index.html && exec nginx -g 'daemon off;'"]
          ports: [{ containerPort: 80 }]
---
apiVersion: v1
kind: Service
metadata: { name: backend-b, namespace: datum-platform }
spec:
  selector: { app: backend-b }
  ports: [{ port: 80, targetPort: 80 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: smoke, namespace: datum-platform }
spec:
  ingressClassName: haproxy
  rules:
    - host: iam.datum.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: backend-a, port: { number: 80 } } }
    - host: apps.datum.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: backend-b, port: { number: 80 } } }
