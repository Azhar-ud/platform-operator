apiVersion: platform.datumlabs.io/v1alpha1
kind: ApplicationManifest
metadata:
  name: clickhouse
spec:
  identity:
    driver: ldap-bridge
  entitlements:
    grantableObjects: [database, table, view]
    actions: [read, write, admin]
  reconciler:
    mode: push
  surface:
    host: clickhouse.datum.local
