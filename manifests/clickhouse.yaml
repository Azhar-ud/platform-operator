apiVersion: platform.datumlabs.io/v1alpha1
kind: ApplicationManifest
metadata:
  name: clickhouse
spec:
  source:
    chart: clickhouse
    repo: https://charts.bitnami.com/bitnami
    version: "6.2.16"  # pin it. always
    # The chart's default image is gone — Bitnami gated its registry in the
    # 2025 relicensing — so the image comes from their legacy mirror. The
    # default shape is also a 6-pod cluster; one node is what the platform
    # needs today. No password here: the chart generates one into a Secret.
    values: |
      shards: 1
      replicaCount: 1
      zookeeper:
        enabled: false
      image:
        repository: bitnamilegacy/clickhouse
      persistence:
        size: 2Gi
      ingress:
        enabled: true
        ingressClassName: haproxy
        hostname: clickhouse.datum.local
  identity:
    # gateway, not ldap-bridge: humans come through the auth proxy on the HTTP
    # interface, native clients use service accounts. Decided on polaris PR #7.
    driver: gateway
  entitlements:
    grantableObjects: [database, table, view]
    actions: [read, write, admin]
  reconciler:
    mode: push
  surface:
    host: clickhouse.datum.local
    launchUrl: https://clickhouse.datum.local/play
    embed: link
    healthCheck: /ping
