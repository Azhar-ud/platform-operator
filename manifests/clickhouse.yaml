apiVersion: platform.datumlabs.io/v1alpha1
kind: ApplicationManifest
metadata:
  name: clickhouse
spec:
  source:
    # The official ClickHouse operator runs the database — official images,
    # no bitnamilegacy, no chart. Keeper and the admin Secret are not named
    # here on purpose: a database needs them, so the platform provides them.
    # Nothing here can open a side door either: no chart means no chart
    # ingress on surface.host.
    clickhouse:
      version: "26.8.1.2041"  # pin it. always — unpinned resolves to newest
      replicas: 1
      shards: 1
      storage: 2Gi
  identity:
    # gateway, not ldap-bridge: humans come through the auth proxy on the HTTP
    # interface, native clients use service accounts. Decided on polaris PR #7.
    driver: gateway
  entitlements:
    grantableObjects: [database, table, view]
    actions: [read, write, admin]
  reconciler:
    mode: push
  surface:
    host: clickhouse.datum.local
    launchUrl: https://clickhouse.datum.local/play
    embed: link
    healthCheck: /ping
