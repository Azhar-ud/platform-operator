apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: applicationmanifests.platform.datumlabs.io
spec:
  group: platform.datumlabs.io
  scope: Namespaced
  names:
    kind: ApplicationManifest
    plural: applicationmanifests
    shortNames:
      - appman
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - identity
                - surface
              properties:

                identity:
                  type: object
                  required:
                    - driver
                  properties:
                    driver:
                      type: string
                      enum:
                        - native-oidc
                        - gateway
                        - ldap-bridge

                entitlements:
                  type: object
                  properties:
                    grantableObjects:
                      type: array
                      items:
                        type: string
                    actions:
                      type: array
                      items:
                        type: string
                    granularity:
                      type: string
                      enum:
                        - application
                        - object
                        - row

                surface:
                  type: object
                  required:
                    - host
                  properties:
                    host:
                      type: string

                reconciler:
                  type: object
                  properties:
                    mode:
                      type: string
                      enum:
                        - push
                        - delegate
                        - gate
                    driver:
                      type: string

                dependencies:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true

                observability:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true

                machineIdentity:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true

            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
