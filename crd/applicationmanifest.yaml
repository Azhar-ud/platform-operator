apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: applicationmanifests.platform.datumlabs.io
spec:
  group: platform.datumlabs.io
  scope: Namespaced
  names:
    kind: ApplicationManifest
    plural: applicationmanifests
    singular: applicationmanifest
    shortNames: [appman]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [identity, surface]
              properties:
                identity:
                  type: object
                entitlements:
                  type: object
                reconciler:
                  type: object
                surface:
                  type: object
                dependencies:
                  type: array
                  items:
                    type: object
                observability:
                  type: object
                machineIdentity:
                  type: object
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true